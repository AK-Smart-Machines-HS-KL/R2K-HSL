#       The navigation_config.yaml file implements the config of                    #
#       controller_navigation.py                                                    #
#       It allowes to modify:                                                       #
#       - task and checkpoint location                                              #
#       - different modes and number of envs                                        #
#       - adding more and changing existing waypoints                               #
#                                                                                   #
